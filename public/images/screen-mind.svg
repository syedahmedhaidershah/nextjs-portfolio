<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="s-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#0a0d14"/>
  <circle cx="400" cy="225" r="180" fill="url(#s-glow)"/>

  <!-- Minimal Circular Focus Radial Gauge -->
  <circle cx="280" cy="225" r="68" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="280" cy="225" r="68" fill="none" stroke="url(#s-wave)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="320 427" transform="rotate(-90 280 225)"/>
  <circle cx="280" cy="225" r="42" fill="#131826"/>
  <!-- Activity pulse dot -->
  <circle cx="280" cy="225" r="10" fill="#10b981"/>

  <!-- Minimal Flow Telemetry Curve (Right) -->
  <g opacity="0.3" stroke="#1e293b" stroke-width="1">
    <line x1="390" y1="170" x2="620" y2="170"/>
    <line x1="390" y1="225" x2="620" y2="225"/>
    <line x1="390" y1="280" x2="620" y2="280"/>
  </g>
  <path d="M 390 260 Q 440 250, 480 200 T 550 210 T 620 160"
        fill="none" stroke="url(#s-wave)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="620" cy="160" r="5" fill="#a78bfa"/>
</svg>